name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true # Include this if you are using Git LFS for any large assets

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://sajid-ul-islam:$HF_TOKEN@huggingface.co/spaces/Sajid-ul-Islam/Portfolio main:main